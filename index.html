<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MAERS 独立游戏合集大厅，汇集解谜、治愈、农业、策略与战术战斗等多元实验游戏卡带。">
    <title>Maers Playbox · 多元独立游戏合集大厅</title>
    <link href="font/base/fonts.css" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=chillax@500,600&display=swap" rel="stylesheet">
    <style>
        /* Hallmark · shape: app screen · genre: playful · theme: Hum · redesign: refined
         * nav: top shelf bar with filter pills · signature: tactile card-stock game cartridge shelf · states: full, loading, empty, error
         * axes: light/rounded-sans/chromatic-yellow · posture: full-palette · contrast: pass */
        @import url("./tokens.css");
        @import url("./base.css");

        body {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            background-color: var(--color-paper);
            color: var(--color-ink);
        }

        .skip-link {
            position: fixed;
            top: var(--space-md);
            left: var(--space-md);
            z-index: var(--z-tooltip);
            background: var(--color-accent);
            color: var(--color-accent-ink);
            padding: var(--space-xs) var(--space-md);
            border-radius: var(--radius-pill);
            text-decoration: none;
            font-weight: 600;
        }

        .playbox-shell {
            width: 100%;
            max-width: var(--container);
            margin-inline: auto;
            padding: var(--space-xl) var(--gutter) var(--space-2xl);
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
            flex: 1;
        }

        .playbox-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: var(--space-lg);
            padding-bottom: var(--space-lg);
            border-bottom: var(--rule-hair) solid var(--color-rule);
            flex-wrap: wrap;
        }

        .brand-lockup {
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
        }

        .brand-title-row {
            display: flex;
            align-items: center;
            gap: var(--space-md);
            flex-wrap: wrap;
        }

        .brand-title {
            font-family: var(--font-display);
            font-size: var(--text-display);
            font-weight: var(--display-weight);
            color: var(--color-ink);
            user-select: none;
            cursor: default;
        }

        .switch-btn {
            display: inline-flex;
            align-items: center;
            min-height: 32px;
            padding: 0 var(--space-md);
            border-radius: var(--radius-stock);
            background: transparent;
            border: var(--rule-hair) solid var(--color-rule);
            color: var(--color-ink-2);
            text-decoration: none;
            font-size: var(--text-xs);
            font-weight: 600;
            white-space: nowrap;
            transition: background-color var(--dur-micro) var(--ease-snap), color var(--dur-micro) var(--ease-snap), transform var(--dur-micro) var(--ease-snap);
        }

        .switch-btn:hover {
            background: var(--color-paper-2);
            color: var(--color-ink);
        }

        .switch-btn:active {
            transform: translateY(1px);
        }

        .brand-subtitle {
            font-size: var(--text-md);
            color: var(--color-ink-2);
            max-width: 56ch;
        }

        .brand-mark {
            background: color-mix(in oklab, var(--color-accent) 60%, transparent);
            color: var(--color-ink);
            padding: 0 var(--space-xs);
            border-radius: var(--space-2xs);
            box-decoration-break: clone;
        }

        .header-stats {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            background: var(--color-card);
            border-radius: var(--radius-stock);
            box-shadow: var(--shadow-stock);
            padding: var(--space-xs) var(--space-md);
        }

        .stat-figure {
            font-family: var(--font-display);
            font-size: var(--text-xl);
            font-weight: var(--display-weight);
            color: var(--color-ink);
            font-variant-numeric: tabular-nums;
        }

        .stat-label {
            font-size: var(--text-xs);
            color: var(--color-muted);
            white-space: nowrap;
        }

        /* 主内容区纵向间距，消除筛选栏与卡带网格粘连 */
        main {
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
            flex: 1;
        }

        /* 类型筛选栏 */
        .shelf-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-md);
            flex-wrap: wrap;
        }

        .filter-nav {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
            flex-wrap: wrap;
        }

        .filter-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
            padding: 0 var(--space-md);
            border-radius: var(--radius-stock);
            border: 0;
            background: var(--color-card);
            color: var(--color-ink-2);
            box-shadow: var(--shadow-stock);
            font-size: var(--text-sm);
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: transform var(--dur-micro) var(--ease-snap), box-shadow var(--dur-micro) var(--ease-snap), background-color var(--dur-micro) var(--ease-snap), color var(--dur-micro) var(--ease-snap);
        }

        .filter-pill:hover:not(:disabled) {
            background: var(--color-paper-2);
            color: var(--color-ink);
        }

        .filter-pill:active:not(:disabled) {
            transform: translateY(1px);
            box-shadow: var(--shadow-stock-active);
        }

        .filter-pill[aria-pressed="true"] {
            background: var(--color-ink);
            color: var(--color-card);
            box-shadow: inset 0 0 0 1px var(--color-ink), 0 2px 0 0 var(--color-ink);
        }

        /* 游戏卡带书架网格 */
        .module-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr));
            gap: var(--gap-columns);
        }

        .module-card {
            background: var(--color-card);
            color: var(--color-ink);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-stock);
            padding: var(--space-lg);
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
            position: relative;
            transition: background-color var(--dur-micro) var(--ease-snap), box-shadow var(--dur-micro) var(--ease-snap);
        }

        .module-card:not(.is-locked):hover {
            box-shadow: var(--shadow-stock-hover);
        }

        .module-card.is-locked {
            background: var(--color-paper-2);
        }

        .card-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-sm);
        }

        .cartridge-slot-num {
            font-family: var(--font-display);
            font-size: var(--text-sm);
            font-weight: var(--display-weight);
            color: var(--color-muted);
            font-variant-numeric: tabular-nums;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 0 var(--space-sm);
            border-radius: var(--radius-pill);
            background: var(--color-accent);
            color: var(--color-accent-ink);
            font-size: var(--text-xs);
            font-weight: 600;
            white-space: nowrap;
        }

        .tag--muted {
            background: var(--color-paper-3);
            color: var(--color-muted);
        }

        .card-cover {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: var(--color-paper-2);
            color: var(--color-ink);
            border-radius: var(--radius-stock);
            overflow: hidden;
            position: relative;
            border: var(--rule-hair) solid var(--color-rule);
        }

        .card-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .empty-cartridge {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: var(--space-xs);
            background: var(--color-paper-2);
            color: var(--color-muted);
            padding: var(--space-lg);
            text-align: center;
        }

        .empty-cartridge-num {
            font-family: var(--font-display);
            font-size: var(--text-2xl);
            font-weight: var(--display-weight);
            color: var(--color-muted);
            font-variant-numeric: tabular-nums;
        }

        .empty-cartridge-text {
            font-size: var(--text-xs);
            color: var(--color-muted);
        }

        .card-body {
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
            flex: 1;
        }

        .module-title {
            font-size: var(--text-xl);
            font-weight: var(--display-weight);
            color: var(--color-ink);
        }

        .module-desc {
            font-size: var(--text-md);
            color: var(--color-ink-2);
            line-height: 1.55;
            white-space: pre-line;
        }

        .footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-sm);
            border-top: var(--rule-hair) solid var(--color-rule);
            padding-top: var(--space-md);
            margin-top: auto;
            flex-wrap: wrap;
        }

        /* 轻薄化实体卡纸按钮（去除原先 5px 厚重底边与臃肿高度） */
        .launch-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
            padding: 0 var(--space-md);
            border: 0;
            border-radius: var(--radius-stock);
            background: var(--color-accent);
            color: var(--color-accent-ink);
            box-shadow: var(--shadow-primary);
            font-size: var(--text-xs);
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
            cursor: pointer;
            transition: transform var(--dur-micro) var(--ease-spring), box-shadow var(--dur-micro) var(--ease-spring);
        }

        .launch-btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-primary-hover);
        }

        .launch-btn:active {
            transform: translateY(1px);
            box-shadow: var(--shadow-primary-active);
        }

        .launch-btn--locked {
            background: var(--color-paper-3);
            color: var(--color-muted);
            box-shadow: none;
            pointer-events: none;
        }

        .manual-btn {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2xs);
            min-height: 34px;
            padding: 0 var(--space-sm);
            background: var(--color-paper);
            color: var(--color-ink-2);
            border: 0;
            border-radius: var(--radius-stock);
            box-shadow: var(--shadow-stock);
            font-size: var(--text-xs);
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: transform var(--dur-micro) var(--ease-snap), box-shadow var(--dur-micro) var(--ease-snap), background-color var(--dur-micro) var(--ease-snap), color var(--dur-micro) var(--ease-snap);
        }

        .manual-btn:hover:not(:disabled) {
            background: var(--color-paper-2);
            color: var(--color-ink);
        }

        .manual-btn:active:not(:disabled) {
            transform: translateY(1px);
            box-shadow: var(--shadow-stock-active);
        }

        /* 保留 guide-book.svg 原生暖黄与深棕配色，禁止反相 */
        .manual-btn img {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        .playbox-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-md);
            padding-top: var(--space-lg);
            border-top: var(--rule-hair) solid var(--color-rule);
            font-size: var(--text-xs);
            color: var(--color-muted);
            flex-wrap: wrap;
        }

        @media (max-width: 56rem) {
            .playbox-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>
    <a href="#mainContent" class="skip-link visually-hidden">跳至游戏卡带架</a>

    <div class="playbox-shell">
        <header class="playbox-header">
            <div class="brand-lockup">
                <div class="brand-title-row">
                    <h1 id="maersTitle" class="brand-title">Maers Playbox</h1>
                </div>
            </div>
            <div class="header-stats" aria-live="polite">
                <span class="stat-label">共</span>
                <span class="stat-figure" id="activeCountFigure">01</span>
                <span class="stat-label">款游戏</span>
            </div>
        </header>

        <main id="mainContent" tabindex="-1">
            <div class="shelf-toolbar">
                <nav class="filter-nav" id="typeFilterNav" aria-label="按游戏类型筛选">
                    <button type="button" class="filter-pill" data-filter="all" aria-pressed="true">全部卡带</button>
                </nav>
            </div>

            <div class="module-grid" id="moduleGrid">
                <!-- 由 JS 从 data/index/modules.json 动态填充 -->
            </div>
        </main>
    </div>

    <script src="manage/index/brief.js"></script>
    <script>
        (function () {
            'use strict';

            const moduleGrid = document.getElementById('moduleGrid');
            const filterNav = document.getElementById('typeFilterNav');
            const activeCountFigure = document.getElementById('activeCountFigure');
            let allModules = [];
            let currentFilter = 'all';

            function formatSlot(num) {
                return String(num).padStart(2, '0');
            }

            /** 打开指定模块的说明书弹窗 */
            async function openModuleManuals(m) {
                try {
                    const manualDir = m.url.replace(/[^/]+$/, '');
                    const res = await fetch(`${manualDir}manuals/order.json`);
                    const manuals = res.ok ? await res.json() : [];
                    BriefModal.show(m.name, m.url || m.filename, Array.isArray(manuals) ? manuals : []);
                } catch (err) {
                    BriefModal.show(m.name, m.url || m.filename, []);
                }
            }

            /** 从静态注册表读取并渲染所有模块 */
            async function loadModules() {
                try {
                    const res = await fetch('data/index/modules.json');
                    if (!res.ok) throw new Error('fetch error');
                    const data = await res.json();
                    allModules = Array.isArray(data.modules) ? data.modules : [];
                    const activeList = allModules.filter(m => m.status === 'active');
                    if (activeCountFigure) {
                        activeCountFigure.textContent = formatSlot(activeList.length);
                    }
                    buildFilterPills(allModules);
                    renderGrid();
                } catch (e) {
                    if (activeCountFigure) {
                        activeCountFigure.textContent = '00';
                    }
                    moduleGrid.innerHTML = '';
                    moduleGrid.appendChild(buildOfflineCard('无法读取游戏合集注册表，请检查网络或本地服务状态。'));
                    moduleGrid.appendChild(buildUnknownCard(2));
                }
            }

            /** 根据模块列表生成类型筛选按钮 */
            function buildFilterPills(list) {
                if (!filterNav) return;
                const types = Array.from(new Set(list.map(m => m.gameType || '未分类')));
                filterNav.innerHTML = '';

                const allBtn = document.createElement('button');
                allBtn.type = 'button';
                allBtn.className = 'filter-pill';
                allBtn.dataset.filter = 'all';
                allBtn.setAttribute('aria-pressed', currentFilter === 'all' ? 'true' : 'false');
                allBtn.textContent = '全部卡带';
                allBtn.addEventListener('click', () => setFilter('all'));
                filterNav.appendChild(allBtn);

                types.forEach(type => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'filter-pill';
                    btn.dataset.filter = type;
                    btn.setAttribute('aria-pressed', currentFilter === type ? 'true' : 'false');
                    btn.textContent = type;
                    btn.addEventListener('click', () => setFilter(type));
                    filterNav.appendChild(btn);
                });
            }

            function setFilter(type) {
                currentFilter = type;
                if (filterNav) {
                    filterNav.querySelectorAll('.filter-pill').forEach(btn => {
                        btn.setAttribute('aria-pressed', btn.dataset.filter === type ? 'true' : 'false');
                    });
                }
                renderGrid();
            }

            function renderGrid() {
                moduleGrid.innerHTML = '';
                const filtered = currentFilter === 'all'
                    ? allModules
                    : allModules.filter(m => (m.gameType || '未分类') === currentFilter);

                filtered.forEach((m, idx) => {
                    moduleGrid.appendChild(buildModuleCard(m, idx + 1));
                });

                moduleGrid.appendChild(buildUnknownCard(filtered.length + 1));
            }

            /** 待上架新游戏预留卡槽 */
            function buildUnknownCard(orderNum) {
                const el = document.createElement('article');
                el.className = 'module-card is-locked';
                el.innerHTML = `
                    <div class="card-top-bar">
                        <span class="cartridge-slot-num">${formatSlot(orderNum)}</span>
                        <span class="tag tag--muted">待制作</span>
                    </div>
                    <div class="card-cover">
                        <div class="empty-cartridge">
                            <span class="empty-cartridge-num">${formatSlot(orderNum)}</span>
                            <span class="empty-cartridge-text">筹备中</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <h2 class="module-title">待定</h2>
                        <p class="module-desc">coding...</p>
                    </div>
                    <div class="footer-row">
                        <span class="launch-btn launch-btn--locked">制作中</span>
                        <span class="stat-label">敬请期待</span>
                    </div>`;
                return el;
            }

            /** 服务器离线时的提示卡（附带重试按钮） */
            function buildOfflineCard(msg) {
                const el = document.createElement('article');
                el.className = 'module-card is-locked';
                el.innerHTML = `
                    <div class="card-top-bar">
                        <span class="cartridge-slot-num">01</span>
                        <span class="tag tag--muted">离线状态</span>
                    </div>
                    <div class="card-cover">
                        <div class="empty-cartridge">
                            <span class="empty-cartridge-num">!</span>
                            <span class="empty-cartridge-text">卡带柜未连接</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <h2 class="module-title">服务器未连接</h2>
                        <p class="module-desc">${esc(msg)}</p>
                    </div>
                    <div class="footer-row">
                        <button type="button" class="manual-btn retry-btn">重新连接</button>
                        <span class="stat-label">请检查服务</span>
                    </div>`;
                const retryBtn = el.querySelector('.retry-btn');
                if (retryBtn) {
                    retryBtn.addEventListener('click', () => loadModules());
                }
                return el;
            }

            /** 构造单个游戏卡带 DOM */
            function buildModuleCard(m, orderNum) {
                const isActive = m.status === 'active';
                const el = document.createElement('article');
                el.className = isActive ? 'module-card' : 'module-card is-locked';

                const coverInner = m.cover
                    ? `<img src="${esc(m.cover)}" alt="${esc(m.name)} 游戏封面" width="640" height="360">`
                    : `<div class="empty-cartridge"><span class="empty-cartridge-num">${formatSlot(orderNum)}</span><span class="empty-cartridge-text">暂无封面</span></div>`;

                const launchControl = isActive
                    ? `<a href="${esc(m.url)}" class="launch-btn">开始游玩</a>`
                    : `<span class="launch-btn launch-btn--locked">制作中</span>`;

                const manualBtnHTML = isActive ? `
                    <button type="button" class="manual-btn" aria-label="查阅 ${esc(m.name)} 游戏说明书">
                        <img src="ui-all/guide-book.svg" alt="" width="15" height="15">
                        <span>说明书</span>
                    </button>
                ` : `<span class="stat-label">未开放</span>`;

                el.innerHTML = `
                    <div class="card-top-bar">
                        <span class="cartridge-slot-num">${formatSlot(orderNum)}</span>
                        <span class="tag">${esc(m.gameType) || '未分类'}</span>
                    </div>
                    <div class="card-cover">${coverInner}</div>
                    <div class="card-body">
                        <h2 class="module-title">${esc(m.name)}</h2>
                        <p class="module-desc">${esc(m.description) || '暂无简介'}</p>
                    </div>
                    <div class="footer-row">
                        ${launchControl}
                        ${manualBtnHTML}
                    </div>`;

                const btn = el.querySelector('.manual-btn');
                if (btn) {
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        openModuleManuals(m);
                    });
                }

                return el;
            }

            function esc(str) {
                return String(str ?? '')
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            loadModules();

            // 暗门：快速三连击标题进入创作者工坊
            let _ac = 0, _at = null;
            document.getElementById('maersTitle').addEventListener('click', () => {
                _ac++;
                if (_ac >= 3) { window.location.href = 'index-admin.html'; return; }
                clearTimeout(_at);
                _at = setTimeout(() => { _ac = 0; }, 600);
            });
        }());
    </script>
</body>

</html>
