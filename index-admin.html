<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MAERS 独立游戏合集创作者工坊，管理解谜、治愈、农业、策略与战术战斗等多元游戏卡带与说明书。">
    <title>Maers Playbox Creator · 游戏管理</title>
    <link href="font/base/fonts.css" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=chillax@500,600&display=swap" rel="stylesheet">
    <style>
        /* Hallmark · shape: app screen · genre: playful · theme: Hum (deal 1/3, seed indie-game-collection-lobby-12fe·403cf290·2026-11-05·r0) · redesign: full
         * nav: top workshop bar with visitor switch and genre filter · signature: tactile card-stock game cartridge workshop and manual editor · states: full, loading, empty, error
         * axes: light/rounded-sans/chromatic-yellow · posture: full-palette · contrast: pass · v2.0.0 */
        /* Hallmark · pre-emit critique: P5 H5 E5 S5 R5 V5 · weakest: S, replaced dark sci-fi admin console with a warm tactile card-stock game cartridge workshop for all game genres */
        @import url("./tokens.css");
        @import url("./base.css");

        body {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            background-color: var(--color-paper);
            color: var(--color-ink);
        }

        .skip-link {
            position: fixed;
            top: var(--space-md);
            left: var(--space-md);
            z-index: var(--z-tooltip);
            background: var(--color-accent);
            color: var(--color-accent-ink);
            padding: var(--space-xs) var(--space-md);
            border-radius: var(--radius-pill);
            text-decoration: none;
            font-weight: 600;
        }

        .playbox-shell {
            width: 100%;
            max-width: var(--container);
            margin-inline: auto;
            padding: var(--space-xl) var(--gutter) var(--space-2xl);
            display: flex;
            flex-direction: column;
            gap: var(--space-xl);
            flex: 1;
        }

        .playbox-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: var(--space-lg);
            padding-bottom: var(--space-lg);
            border-bottom: var(--rule-hair) solid var(--color-rule);
            flex-wrap: wrap;
        }

        .brand-lockup {
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
        }

        .brand-title-row {
            display: flex;
            align-items: center;
            gap: var(--space-md);
            flex-wrap: wrap;
        }

        .brand-title {
            font-family: var(--font-display);
            font-size: var(--text-display);
            font-weight: var(--display-weight);
            color: var(--color-ink);
        }

        .switch-btn {
            display: inline-flex;
            align-items: center;
            min-height: 32px;
            padding: 0 var(--space-md);
            border-radius: var(--radius-stock);
            background: transparent;
            border: var(--rule-hair) solid var(--color-rule);
            color: var(--color-ink-2);
            text-decoration: none;
            font-size: var(--text-xs);
            font-weight: 600;
            white-space: nowrap;
            transition: background-color var(--dur-micro) var(--ease-snap), color var(--dur-micro) var(--ease-snap), transform var(--dur-micro) var(--ease-snap);
        }

        .switch-btn:hover {
            background: var(--color-paper-2);
            color: var(--color-ink);
        }

        .switch-btn:active {
            transform: translateY(1px);
        }

        .brand-subtitle {
            font-size: var(--text-md);
            color: var(--color-ink-2);
            max-width: 58ch;
        }

        .brand-mark {
            background: color-mix(in oklab, var(--color-accent) 60%, transparent);
            color: var(--color-ink);
            padding: 0 var(--space-xs);
            border-radius: var(--space-2xs);
            box-decoration-break: clone;
        }

        /* 主内容区纵向间距 */
        main {
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
            flex: 1;
        }

        .shelf-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-md);
            flex-wrap: wrap;
            background: var(--color-hill-1);
            border: var(--rule-hair) solid var(--color-rule);
            border-radius: var(--radius-card);
            padding: var(--space-md) var(--space-lg);
        }

        .toolbar-Summary {
            display: flex;
            flex-direction: column;
            gap: var(--space-2xs);
        }

        .toolbar-title {
            font-size: var(--text-lg);
            font-weight: var(--display-weight);
            color: var(--color-ink);
        }

        .toolbar-note {
            font-size: var(--text-sm);
            color: var(--color-ink-2);
        }

        /* 游戏卡带书架网格 */
        .module-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr));
            gap: var(--gap-columns);
        }

        .module-card {
            background: var(--color-card);
            color: var(--color-ink);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-stock);
            padding: var(--space-lg);
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
            position: relative;
            transition: background-color var(--dur-micro) var(--ease-snap), box-shadow var(--dur-micro) var(--ease-snap);
        }

        .module-card:hover {
            box-shadow: var(--shadow-stock-hover);
        }

        .module-card:active {
            transform: translateY(var(--space-3xs));
            box-shadow: var(--shadow-stock-active);
        }

        .module-card--create {
            background: var(--color-paper-2);
            cursor: pointer;
            justify-content: space-between;
        }

        .card-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-xs);
            flex-wrap: wrap;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 0 var(--space-sm);
            border-radius: var(--radius-pill);
            background: var(--color-accent);
            color: var(--color-accent-ink);
            font-size: var(--text-xs);
            font-weight: 600;
            white-space: nowrap;
        }

        .tag--muted {
            background: var(--color-paper-3);
            color: var(--color-muted);
        }

        .card-controls {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
        }

        .ctrl-btn,
        .manual-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2xs);
            min-height: 32px;
            padding: 0 var(--space-sm);
            background: var(--color-paper);
            color: var(--color-ink);
            border: var(--rule-hair) solid var(--color-rule);
            border-radius: var(--radius-stock);
            font-size: var(--text-xs);
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color var(--dur-micro) var(--ease-snap), color var(--dur-micro) var(--ease-snap), transform var(--dur-micro) var(--ease-snap);
        }

        .ctrl-btn:hover,
        .manual-btn:hover {
            background: var(--color-paper-2);
        }

        .ctrl-btn:active,
        .manual-btn:active {
            transform: translateY(1px);
        }

        .ctrl-btn.del:hover {
            background: var(--color-error);
            color: var(--color-card);
            border-color: var(--color-error);
        }

        /* 保留 guide-book.svg 原生暖黄与深棕配色，禁止反相 */
        .manual-btn img {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        .card-cover {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: var(--color-paper-2);
            color: var(--color-ink);
            border-radius: var(--radius-stock);
            overflow: hidden;
            position: relative;
            border: var(--rule-hair) solid var(--color-rule);
        }

        .card-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .empty-icon {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: var(--space-xs);
            background: var(--color-paper);
            color: var(--color-ink);
            padding: var(--space-lg);
            text-align: center;
        }

        .empty-plus {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: var(--space-xl);
            height: var(--space-xl);
            border-radius: var(--radius-pill);
            background: var(--color-accent);
            color: var(--color-accent-ink);
            font-size: var(--text-xl);
            font-weight: var(--display-weight);
        }

        .empty-caption {
            font-size: var(--text-sm);
            color: var(--color-ink-2);
            font-weight: 600;
        }

        .card-body {
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
            flex: 1;
        }

        .card-body h2 {
            font-size: var(--text-xl);
            font-weight: var(--display-weight);
            color: var(--color-ink);
        }

        .card-body p {
            font-size: var(--text-md);
            color: var(--color-ink-2);
            line-height: 1.55;
            white-space: pre-line;
        }

        .footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-sm);
            border-top: var(--rule-hair) solid var(--color-rule);
            padding-top: var(--space-md);
            margin-top: auto;
            flex-wrap: wrap;
        }

        .launch-btn,
        .btn-confirm {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
            padding: 0 var(--space-md);
            border: 0;
            border-radius: var(--radius-stock);
            background: var(--color-accent);
            color: var(--color-accent-ink);
            box-shadow: var(--shadow-primary);
            font-size: var(--text-xs);
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
            cursor: pointer;
            transition: transform var(--dur-micro) var(--ease-spring), box-shadow var(--dur-micro) var(--ease-spring);
        }

        .launch-btn:hover:not(:disabled),
        .btn-confirm:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: var(--shadow-primary-hover);
        }

        .launch-btn:active:not(:disabled),
        .btn-confirm:active:not(:disabled) {
            transform: translateY(1px);
            box-shadow: var(--shadow-primary-active);
        }

        .btn-confirm:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .launch-btn--secondary {
            background: transparent;
            border: var(--rule-hair) solid var(--color-rule);
            color: var(--color-ink);
            box-shadow: none;
        }

        .state-note {
            font-size: var(--text-xs);
            color: var(--color-muted);
            white-space: nowrap;
        }

        /* ─── 弹窗（新建/编辑模块 & 说明书编辑器） ─── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: var(--color-scrim);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: var(--z-modal);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity var(--dur-short) var(--ease-out), visibility var(--dur-short) var(--ease-out);
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .modal {
            background: var(--color-card);
            color: var(--color-ink);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-stock);
            width: 480px;
            max-width: 92%;
            padding: var(--space-xl);
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
            transform: translateY(var(--space-md));
            transition: transform var(--dur-long) var(--ease-out);
        }

        .modal--wide {
            width: 640px;
            max-width: 95%;
        }

        .modal-overlay.show .modal {
            transform: translateY(0);
        }

        .modal h3 {
            font-size: var(--text-xl);
            font-weight: var(--display-weight);
            color: var(--color-ink);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
        }

        .form-group label {
            font-size: var(--text-sm);
            font-weight: 600;
            color: var(--color-ink-2);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: var(--space-xs);
            cursor: pointer;
            font-size: var(--text-sm);
            color: var(--color-ink-2);
        }

        .checkbox-input {
            width: var(--space-md);
            height: var(--space-md);
            accent-color: var(--color-accent-2);
        }

        .preview-filename {
            font-weight: 600;
            color: var(--color-accent-2);
        }

        .form-group input[type="text"],
        .form-group textarea {
            width: 100%;
            background: var(--color-paper);
            border: var(--rule-hair) solid var(--color-muted);
            border-radius: var(--radius-input);
            color: var(--color-ink);
            padding: var(--space-sm) var(--space-md);
            font-family: var(--font-body);
            font-size: var(--text-md);
            resize: none;
        }

        .form-group input[type="text"] {
            min-height: 48px;
        }

        .form-group textarea {
            min-height: 96px;
        }

        .form-group input[type="text"]:focus-visible,
        .form-group textarea:focus-visible {
            outline: 2px solid var(--color-focus);
            outline-offset: -2px;
        }

        #inputManualText {
            min-height: 260px;
            line-height: 1.7;
            scrollbar-width: thin;
            scrollbar-color: var(--color-muted) transparent;
        }

        .modal-error {
            font-size: var(--text-sm);
            color: var(--color-error);
            min-height: 1lh;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: var(--space-sm);
            padding-top: var(--space-xs);
        }

        .btn-cancel {
            min-height: 34px;
            padding: 0 var(--space-md);
            background: transparent;
            border: var(--rule-hair) solid var(--color-rule);
            border-radius: var(--radius-stock);
            color: var(--color-ink-2);
            font-size: var(--text-xs);
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color var(--dur-micro) var(--ease-snap), color var(--dur-micro) var(--ease-snap);
        }

        .btn-cancel:hover:not(:disabled) {
            background: var(--color-paper-2);
            color: var(--color-ink);
        }

        .btn-cancel:active:not(:disabled) {
            transform: translateY(var(--space-3xs));
        }

        /* ─── 说明书分类 Tab ─── */
        .manual-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-xs);
            padding-bottom: var(--space-sm);
            border-bottom: var(--rule-hair) solid var(--color-rule);
        }

        .manual-tab {
            background: var(--color-paper);
            border: var(--rule-hair) solid var(--color-rule);
            border-radius: var(--radius-pill);
            color: var(--color-ink-2);
            min-height: 36px;
            padding: 0 var(--space-md);
            cursor: pointer;
            font-size: var(--text-sm);
            font-weight: 600;
            transition: background-color var(--dur-micro) var(--ease-snap), color var(--dur-micro) var(--ease-snap);
        }

        .manual-tab:hover {
            background: var(--color-paper-2);
            color: var(--color-ink);
        }

        .manual-tab.active {
            background: var(--color-ink);
            border-color: var(--color-ink);
            color: var(--color-card);
        }

        .manual-tab.dragging {
            opacity: 0.55;
        }

        .manual-tab-add {
            background: var(--color-accent);
            border: 0;
            border-radius: var(--radius-pill);
            color: var(--color-accent-ink);
            min-height: 36px;
            padding: 0 var(--space-md);
            cursor: pointer;
            font-size: var(--text-sm);
            font-weight: 600;
            transition: transform var(--dur-micro) var(--ease-snap);
        }

        .manual-tab-add:hover {
            transform: translateY(-1px);
        }

        .manual-tab-add:active {
            transform: translateY(var(--space-3xs));
        }

        /* ─── Tab 右键菜单 ─── */
        .tab-ctx-menu {
            position: fixed;
            z-index: var(--z-dropdown);
            background: var(--color-card);
            border: var(--rule-hair) solid var(--color-rule);
            border-radius: var(--radius-stock);
            min-width: 140px;
            padding: var(--space-2xs);
            display: none;
        }

        .tab-ctx-menu.show {
            display: block;
        }

        .tab-ctx-item {
            display: block;
            width: 100%;
            background: transparent;
            border: 0;
            border-radius: var(--space-xs);
            color: var(--color-ink);
            padding: var(--space-xs) var(--space-md);
            font-size: var(--text-sm);
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: background-color var(--dur-micro) var(--ease-snap), color var(--dur-micro) var(--ease-snap);
        }

        .tab-ctx-item:hover {
            background: var(--color-paper-2);
        }

        .tab-ctx-item.danger:hover {
            background: var(--color-error);
            color: var(--color-card);
        }

        @media (max-width: 48rem) {
            .playbox-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .module-grid {
                grid-template-columns: minmax(0, 1fr);
            }
        }
    </style>
</head>

<body>
    <a href="#mainContent" class="skip-link visually-hidden">跳至游戏管理列表</a>

    <div class="playbox-shell">
        <header class="playbox-header">
            <div class="brand-lockup">
                <div class="brand-title-row">
                    <h1 class="brand-title">Maers Playbox Creator</h1>
                    <a href="index.html" class="switch-btn">切换至访客大厅</a>
                </div>
            </div>
        </header>

        <main id="mainContent" tabindex="-1">
            <div class="module-grid" id="moduleGrid">
                <!-- 由 JS 从 /api/list-modules 动态填充 -->

                <!-- 添加模块按钮（始终在末尾）-->
                <div class="module-card module-card--create" id="addModuleCard" role="button" tabindex="0" aria-label="新建游戏模块">
                    <div class="card-top-bar">
                        <span class="tag tag--muted">新游戏</span>
                    </div>
                    <div class="card-cover">
                        <div class="empty-icon">
                            <span class="empty-plus">+</span>
                            <span class="empty-caption">点击创建新游戏</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <h2>新建游戏模块</h2>
                        <p>等你发挥想象力…</p>
                    </div>
                    <div class="footer-row">
                        <span class="launch-btn launch-btn--secondary">创建新游戏</span>
                        <span class="state-note">自动归档至 games 目录</span>
                    </div>
                </div>
            </div>
        </main>

        <!-- 添加/编辑模块弹窗 -->
        <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal">
                <h3 id="modalTitle">新建游戏模块</h3>
                <input type="hidden" id="editFilename">
                <div class="form-group">
                    <label for="inputName">模块名称 *</label>
                    <input type="text" id="inputName" placeholder="例：田园物语 / 齿轮迷宫 / SQ-DU" maxlength="64" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="inputType">游戏类型（决定 games 下的分类目录）</label>
                    <input type="text" id="inputType" placeholder="例：治愈农业 / 解谜 / 策略 / sq-du" maxlength="32" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="inputDesc">游戏简介</label>
                    <textarea id="inputDesc" placeholder="一句话介绍这款游戏的核心玩法与特色…"></textarea>
                </div>
                <div class="form-group" id="manualFieldGroup">
                    <label for="inputManual">初始说明书章节名 *</label>
                    <input type="text" id="inputManual" placeholder="例：玩法指南 / 基础机制" maxlength="64" autocomplete="off">
                </div>
                <!-- 编辑模式下才显示的重命名选项 -->
                <div class="form-group" id="renameGroup" hidden>
                    <label class="checkbox-label" for="chkRename">
                        <input type="checkbox" id="chkRename" class="checkbox-input">
                        <span>同步重命名 HTML 文件（<span id="previewFilename" class="preview-filename"></span>）</span>
                    </label>
                </div>
                <div class="modal-error" id="modalError" role="status" aria-live="polite"></div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="btnCancel">取消</button>
                    <button type="button" class="btn-confirm" id="btnConfirm">创建模块</button>
                </div>
            </div>
        </div>

        <!-- Tab 右键菜单 -->
        <div class="tab-ctx-menu" id="tabCtxMenu" role="menu">
            <button type="button" class="tab-ctx-item" id="ctxRenameManual" role="menuitem">重命名章节</button>
            <button type="button" class="tab-ctx-item danger" id="ctxDeleteManual" role="menuitem">删除章节</button>
        </div>

        <!-- 独立说明书编辑弹窗（多分类 Tab） -->
        <div class="modal-overlay" id="manualOverlay" role="dialog" aria-modal="true" aria-labelledby="manualModalTitle">
            <div class="modal modal--wide">
                <h3 id="manualModalTitle">游戏说明书管理</h3>
                <input type="hidden" id="manualFilename">
                <div class="manual-tabs" id="manualTabs" role="tablist">
                    <!-- 动态生成分类按钮 -->
                    <button type="button" class="manual-tab-add" id="manualAddTab" aria-label="新建说明书章节">+ 新建章节</button>
                </div>
                <div class="form-group">
                    <label for="inputManualText">章节正文内容（支持直接拖拽上方标签排序，右键标签可重命名或删除）</label>
                    <textarea id="inputManualText" placeholder="选择一个章节后在此编写游戏说明内容…"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="btnCancelManual">关闭</button>
                    <button type="button" class="btn-confirm" id="btnSaveManual">保存说明书</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/manage/index/toast.js"></script>
    <script>
        (function () {
            'use strict';

            const addCard          = document.getElementById('addModuleCard');
            const overlay          = document.getElementById('modalOverlay');
            const modalTitle       = document.getElementById('modalTitle');
            const btnCancel        = document.getElementById('btnCancel');
            const btnConfirm       = document.getElementById('btnConfirm');
            const inputName        = document.getElementById('inputName');
            const inputType        = document.getElementById('inputType');
            const inputDesc        = document.getElementById('inputDesc');
            const editFilename     = document.getElementById('editFilename');
            const renameGroup      = document.getElementById('renameGroup');
            const chkRename        = document.getElementById('chkRename');
            const previewFile      = document.getElementById('previewFilename');
            const modalError       = document.getElementById('modalError');
            const moduleGrid       = document.getElementById('moduleGrid');

            const manualOverlay    = document.getElementById('manualOverlay');
            const manualModalTitle = document.getElementById('manualModalTitle');
            const manualFilename   = document.getElementById('manualFilename');
            const inputManualText  = document.getElementById('inputManualText');
            const btnCancelManual  = document.getElementById('btnCancelManual');
            const btnSaveManual    = document.getElementById('btnSaveManual');
            const manualTabs       = document.getElementById('manualTabs');
            const manualAddTab     = document.getElementById('manualAddTab');
            const inputManual      = document.getElementById('inputManual');
            const manualFieldGroup = document.getElementById('manualFieldGroup');
            const tabCtxMenu       = document.getElementById('tabCtxMenu');
            const ctxRenameManual  = document.getElementById('ctxRenameManual');
            const ctxDeleteManual  = document.getElementById('ctxDeleteManual');

            let currentManualTab = null;
            let ctxTargetTab = null;

            // ── 页面加载：从注册表渲染所有模块 ──────────
            async function loadModules() {
                try {
                    const res  = await fetch('/api/list-modules');
                    const list = await res.json();
                    list.forEach(m => {
                        moduleGrid.insertBefore(buildModuleCard(m), addCard);
                    });
                } catch (e) {
                    console.warn('[MAERS] 无法连接服务器，尝试从静态注册表读取。', e);
                    try {
                        const res = await fetch('data/index/modules.json');
                        const data = await res.json();
                        (data.modules || []).forEach(m => {
                            moduleGrid.insertBefore(buildModuleCard(m), addCard);
                        });
                    } catch (err) {
                        console.warn('[MAERS] 静态注册表也未能读取。', err);
                    }
                }
            }
            loadModules();

            // ── 实时预览文件名 ────────────────────
            inputName.addEventListener('input', () => {
                if (!renameGroup.hidden) {
                    const safe = inputName.value.trim().replace(/[^\w\u4e00-\u9fff\-]/g, '-');
                    previewFile.textContent = safe ? safe + '.html' : '...';
                }
            });

            // ── 弹窗开关 ───────────────────────────────
            function openCreateModal() {
                editFilename.value  = '';
                inputName.value     = '';
                inputType.value     = '';
                inputDesc.value     = '';
                inputManual.value   = '';
                modalError.textContent = '';
                btnConfirm.textContent = '创建模块';
                btnConfirm.disabled    = false;
                modalTitle.textContent = '新建游戏模块';
                renameGroup.hidden = true;
                manualFieldGroup.hidden = false;
                overlay.classList.add('show');
                setTimeout(() => inputName.focus(), 100);
            }

            function openEditModal(m) {
                editFilename.value  = m.filename;
                inputName.value     = m.name;
                inputType.value     = m.gameType || '';
                inputDesc.value     = m.description || '';
                modalError.textContent = '';
                btnConfirm.textContent = '保存修改';
                btnConfirm.disabled    = false;
                modalTitle.textContent = '编辑游戏模块';
                chkRename.checked      = false;
                const safe = m.name.replace(/[^\w\u4e00-\u9fff\-]/g, '-');
                previewFile.textContent = safe + '.html';
                renameGroup.hidden = false;
                manualFieldGroup.hidden = true;
                overlay.classList.add('show');
                setTimeout(() => inputName.focus(), 100);
            }

            function closeModal() {
                overlay.classList.remove('show');
            }

            addCard.addEventListener('click', openCreateModal);
            addCard.addEventListener('keydown', e => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    openCreateModal();
                }
            });
            btnCancel.addEventListener('click', closeModal);
            overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
            document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

            // ── 提交（创建 / 保存）──────────────────────
            btnConfirm.addEventListener('click', async () => {
                const name        = inputName.value.trim();
                const gameType    = inputType.value.trim();
                const description = inputDesc.value.trim();
                const filename    = editFilename.value;
                const isEdit      = !!filename;

                if (!name) {
                    modalError.textContent = '模块名称不能为空。';
                    inputName.focus();
                    return;
                }

                const manual = inputManual ? inputManual.value.trim() : '';
                if (!isEdit && !manual) {
                    modalError.textContent = '初始说明书章节名称不能为空。';
                    inputManual.focus();
                    return;
                }

                btnConfirm.disabled    = true;
                btnConfirm.textContent = isEdit ? '正在保存…' : '正在创建…';
                modalError.textContent = '';

                try {
                    let res, data;
                    if (isEdit) {
                        res  = await fetch('/api/update-module', {
                            method:  'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body:    JSON.stringify({ filename, name, gameType, description, rename: chkRename.checked }),
                        });
                        data = await res.json();
                        if (!res.ok) throw new Error(data.error);
                        const oldCard = moduleGrid.querySelector(`[data-filename="${filename}"]`);
                        if (oldCard) {
                            const newCard = buildModuleCard(data.module);
                            moduleGrid.insertBefore(newCard, oldCard);
                            oldCard.remove();
                        }
                        Toast.success(`${data.module.filename} 更新成功`);
                    } else {
                        res  = await fetch('/api/create-module', {
                            method:  'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body:    JSON.stringify({ name, gameType, description, manual }),
                        });
                        data = await res.json();
                        if (!res.ok) throw new Error(data.error);
                        moduleGrid.insertBefore(buildModuleCard(data.module), addCard);
                        Toast.success(`${data.module.filename} 创建成功`);
                    }
                    closeModal();
                } catch (err) {
                    modalError.textContent = err.message || '操作失败，请重试。';
                    btnConfirm.disabled    = false;
                    btnConfirm.textContent = isEdit ? '保存修改' : '创建模块';
                }
            });

            [inputName, inputType, inputDesc].forEach(el => {
                el.addEventListener('keydown', e => {
                    if (e.key === 'Enter' && !e.shiftKey && el.tagName !== 'TEXTAREA') btnConfirm.click();
                });
            });

            // ── 说明书多分类编辑逻辑 ────────────────────
            function closeManualModal() {
                manualOverlay.classList.remove('show');
                currentManualTab = null;
            }

            btnCancelManual.addEventListener('click', closeManualModal);
            manualOverlay.addEventListener('click', e => { if (e.target === manualOverlay) closeManualModal(); });
            document.addEventListener('keydown', e => { if (e.key === 'Escape') closeManualModal(); });

            async function loadManualTabs(filename) {
                try {
                    const res = await fetch(`/api/list-manuals?filename=${encodeURIComponent(filename)}`);
                    const data = await res.json();
                    const names = data.manuals || [];

                    manualTabs.querySelectorAll('.manual-tab').forEach(t => t.remove());

                    names.forEach(name => {
                        const tab = document.createElement('button');
                        tab.type = 'button';
                        tab.className = 'manual-tab';
                        tab.setAttribute('role', 'tab');
                        tab.textContent = name;
                        tab.draggable = true;

                        tab.addEventListener('click', () => selectManualTab(filename, name));

                        tab.addEventListener('contextmenu', (e) => {
                            e.preventDefault();
                            ctxTargetTab = name;
                            tabCtxMenu.style.left = e.clientX + 'px';
                            tabCtxMenu.style.top = e.clientY + 'px';
                            tabCtxMenu.classList.add('show');
                        });

                        tab.addEventListener('dragstart', (e) => {
                            e.dataTransfer.effectAllowed = 'move';
                            tab.classList.add('dragging');
                            e.dataTransfer.setData('text/plain', name);
                        });

                        tab.addEventListener('dragend', () => {
                            tab.classList.remove('dragging');
                        });

                        tab.addEventListener('dragover', (e) => {
                            e.preventDefault();
                            e.dataTransfer.dropEffect = 'move';
                        });

                        tab.addEventListener('drop', async (e) => {
                            e.preventDefault();
                            const draggedName = e.dataTransfer.getData('text/plain');
                            if (draggedName === name) return;

                            const allTabs = Array.from(manualTabs.querySelectorAll('.manual-tab'));
                            const draggedIdx = allTabs.findIndex(t => t.textContent === draggedName);
                            const dropIdx = allTabs.findIndex(t => t.textContent === name);

                            if (draggedIdx === -1 || dropIdx === -1) return;

                            const draggedTab = allTabs[draggedIdx];
                            if (draggedIdx < dropIdx) {
                                manualTabs.insertBefore(draggedTab, tab.nextSibling);
                            } else {
                                manualTabs.insertBefore(draggedTab, tab);
                            }

                            const newOrder = Array.from(manualTabs.querySelectorAll('.manual-tab')).map(t => t.textContent);
                            try {
                                const res = await fetch('/api/reorder-manuals', {
                                    method: 'PUT',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ filename, order: newOrder })
                                });
                                if (!res.ok) Toast.error('章节顺序保存失败');
                            } catch (err) {
                                Toast.error('排序请求失败：' + err.message);
                            }
                        });

                        manualTabs.insertBefore(tab, manualAddTab);
                    });

                    if (names.length > 0) {
                        selectManualTab(filename, names[0]);
                    } else {
                        currentManualTab = null;
                        inputManualText.value = '';
                        inputManualText.placeholder = '请先点击「+ 新建章节」创建一个说明章节…';
                    }
                } catch (err) {
                    console.error('[MAERS] 加载说明书分类失败', err);
                }
            }

            async function selectManualTab(filename, name) {
                manualTabs.querySelectorAll('.manual-tab').forEach(t => {
                    const active = t.textContent === name;
                    t.classList.toggle('active', active);
                    t.setAttribute('aria-selected', active ? 'true' : 'false');
                });
                currentManualTab = name;
                inputManualText.value = '正在读取…';

                try {
                    const res = await fetch(`/api/get-manual?filename=${encodeURIComponent(filename)}&manual=${encodeURIComponent(name)}`);
                    const data = await res.json();
                    inputManualText.value = res.ok ? (data.text || '') : '';
                } catch (err) {
                    inputManualText.value = '';
                }
            }

            manualAddTab.addEventListener('click', async () => {
                const name = prompt('请输入新说明书章节名称：');
                if (!name || !name.trim()) return;

                const filename = manualFilename.value;
                try {
                    const res = await fetch('/api/create-manual', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename, manual: name.trim() }),
                    });
                    const data = await res.json();
                    if (!res.ok) { Toast.error(data.error || '创建失败'); return; }
                    Toast.success(`章节「${name.trim()}」创建成功`);
                    await loadManualTabs(filename);
                    selectManualTab(filename, name.trim());
                } catch (err) {
                    Toast.error('创建失败：' + err.message);
                }
            });

            btnSaveManual.addEventListener('click', async () => {
                const fn = manualFilename.value;
                const text = inputManualText.value;

                if (!currentManualTab) {
                    Toast.error('请先选择一个章节');
                    return;
                }

                btnSaveManual.disabled = true;
                btnSaveManual.textContent = '正在保存…';

                try {
                    const res = await fetch('/api/update-manual', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: fn, manual: currentManualTab, text: text })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error);
                    Toast.success('说明书已保存');
                } catch (err) {
                    Toast.error('保存失败：' + err.message);
                } finally {
                    btnSaveManual.disabled = false;
                    btnSaveManual.textContent = '保存说明书';
                }
            });

            document.addEventListener('click', () => tabCtxMenu.classList.remove('show'));
            document.addEventListener('contextmenu', (e) => {
                if (!e.target.closest('.manual-tab')) tabCtxMenu.classList.remove('show');
            });

            ctxRenameManual.addEventListener('click', async () => {
                tabCtxMenu.classList.remove('show');
                if (!ctxTargetTab) return;

                const newName = prompt('请输入新章节名称：', ctxTargetTab);
                if (!newName || !newName.trim() || newName.trim() === ctxTargetTab) return;

                const filename = manualFilename.value;
                try {
                    const res = await fetch('/api/rename-manual', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename, oldName: ctxTargetTab, newName: newName.trim() }),
                    });
                    const data = await res.json();
                    if (!res.ok) { Toast.error(data.error || '重命名失败'); return; }
                    Toast.success(`已重命名为「${newName.trim()}」`);
                    if (currentManualTab === ctxTargetTab) currentManualTab = newName.trim();
                    await loadManualTabs(filename);
                    if (currentManualTab) selectManualTab(filename, currentManualTab);
                } catch (err) {
                    Toast.error('重命名失败：' + err.message);
                }
            });

            ctxDeleteManual.addEventListener('click', async () => {
                tabCtxMenu.classList.remove('show');
                if (!ctxTargetTab) return;
                if (!confirm(`确定删除说明书章节「${ctxTargetTab}」？\n此操作不可恢复。`)) return;

                const filename = manualFilename.value;
                try {
                    const res = await fetch('/api/delete-manual', {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename, manual: ctxTargetTab }),
                    });
                    const data = await res.json();
                    if (!res.ok) { Toast.error(data.error || '删除失败'); return; }
                    Toast.success(`章节「${ctxTargetTab}」已删除`);
                    if (currentManualTab === ctxTargetTab) {
                        currentManualTab = null;
                        inputManualText.value = '';
                    }
                    await loadManualTabs(filename);
                } catch (err) {
                    Toast.error('删除失败：' + err.message);
                }
            });

            // ── 删除模块 ──────────────────────────────────
            async function deleteModule(filename, cardEl) {
                if (!confirm(`确定删除模块 "${filename}"？\n\n此操作将同时删除对应的 HTML 文件，不可恢复。`)) return;
                try {
                    const res  = await fetch('/api/delete-module', {
                        method:  'DELETE',
                        headers: { 'Content-Type': 'application/json' },
                        body:    JSON.stringify({ filename }),
                    });
                    const data = await res.json();
                    if (!res.ok) { Toast.error(data.error || '删除失败'); return; }
                    cardEl.remove();
                    Toast.success(`${filename} 删除成功`);
                } catch (e) {
                    Toast.error('删除失败：' + e.message);
                }
            }

            // ── 构造卡片 DOM ───────────────
            function buildModuleCard(m) {
                const isActive = m.status === 'active';
                const el = document.createElement('article');
                el.className = 'module-card';
                el.dataset.filename = m.filename;

                const coverInner = m.cover
                    ? `<img src="${esc(m.cover)}" alt="${esc(m.name)} 游戏封面" width="640" height="360">`
                    : `<div class="empty-icon"><span class="empty-caption">暂无封面图</span></div>`;

                const launchLabel = isActive
                    ? `<a href="${esc(m.url)}" class="launch-btn">进入游戏</a>`
                    : `<span class="launch-btn launch-btn--secondary">未开放</span>`;

                const manualBtnHTML = isActive ? `
                    <button type="button" class="manual-btn" aria-label="编写 ${esc(m.name)} 说明书">
                        <img src="/ui-all/guide-book.svg" alt="" width="16" height="16">
                        <span>说明书</span>
                    </button>
                ` : '';

                el.innerHTML = `
                    <div class="card-top-bar">
                        <span class="tag">${esc(m.gameType) || '未分类'}</span>
                        <div class="card-controls">
                            ${manualBtnHTML}
                            <button type="button" class="ctrl-btn edit" aria-label="编辑 ${esc(m.name)}">编辑</button>
                            <button type="button" class="ctrl-btn del" aria-label="删除 ${esc(m.name)}">删除</button>
                        </div>
                    </div>
                    <div class="card-cover">${coverInner}</div>
                    <div class="card-body">
                        <h2>${esc(m.name)}</h2>
                        <p>${esc(m.description) || '暂无简介'}</p>
                    </div>
                    <div class="footer-row">
                        ${launchLabel}
                        <span class="state-note">${esc(m.filename)}</span>
                    </div>`;

                if (isActive) {
                    el.addEventListener('click', e => {
                        if (!e.target.closest('.ctrl-btn') && !e.target.closest('.manual-btn') && !e.target.closest('.launch-btn')) {
                            window.location.href = m.url;
                        }
                    });
                }

                el.querySelector('.ctrl-btn.edit').addEventListener('click', e => {
                    e.stopPropagation();
                    openEditModal(m);
                });

                el.querySelector('.ctrl-btn.del').addEventListener('click', e => {
                    e.stopPropagation();
                    deleteModule(m.filename, el);
                });

                const manBtn = el.querySelector('.manual-btn');
                if (manBtn) {
                    manBtn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        e.preventDefault();
                        manualFilename.value = m.filename;
                        manualModalTitle.textContent = `${m.name} · 说明书管理`;
                        inputManualText.value = '';
                        currentManualTab = null;
                        manualOverlay.classList.add('show');
                        await loadManualTabs(m.filename);
                    });
                }

                return el;
            }

            function esc(str) {
                return String(str ?? '')
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }
        }());
    </script>
</body>

</html>
